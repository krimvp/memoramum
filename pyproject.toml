[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoramum"
version = "0.1.0"
description = "Reference implementation of the Memoramum memory service (rollout phase P4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
memoramum-api = "memoramum.rest:main"
memoramum-mcp = "memoramum.mcp_server:main"
memoramum-migrate = "memoramum.db:main"
memoramum-seed = "memoramum.seed:main"
memoramum-consolidate = "memoramum.consolidator:main"
memoramum-extract = "memoramum.extraction:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memoramum = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
